<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COFFEE - Sản phẩm</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">COFFEE</a>

        <nav class="main-nav">
          <a href="index.html">Trang chủ</a>
          <a href="products.html" class="active">Sản phẩm</a>
          <a href="cart.html">Giỏ hàng</a>
          <a href="checkout.html">Thanh toán</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Menu cà phê</p>
          <h1>Sản phẩm</h1>
          <p>Chọn món cà phê bạn thích và thêm vào giỏ hàng để đặt nhanh.</p>
        </div>
      </section>

      <section id="filter-products" class="section">
        <div class="container products-layout">
          <aside class="filter-sidebar">
            <form class="filter-panel" action="#">
              <h2>Bộ lọc</h2>

              <div class="filter-group">
                <label class="filter-label" for="search-product">Tìm sản phẩm</label>
                <input type="text" id="search-product" placeholder="Nhập tên sản phẩm" />
              </div>

              <div class="filter-group">
                <label class="filter-label" for="category-product">Danh mục</label>
                <div class="select-wrap">
                  <select id="category-product">
                    <option>Tất cả danh mục</option>
                    <option>Cà phê Việt</option>
                    <option>Espresso</option>
                    <option>Cold Brew</option>
                  </select>
                </div>
              </div>

              <div id="product-filter" class="filter-group">
                <label class="filter-label" for="status-product">Trạng thái</label>
                <div class="select-wrap">
                  <select id="status-product">
                    <option>Tất cả sản phẩm</option>
                    <option>Bán chạy</option>
                    <option>Sản phẩm mới</option>
                    <option>Giảm giá</option>
                  </select>
                </div>
              </div>

              <div class="filter-group">
                <p class="filter-label">Khoảng giá</p>
                <div class="price-range">
                  <input type="range" min="0" max="100" value="20" aria-label="Giá thấp nhất" />
                  <input type="range" min="0" max="100" value="80" aria-label="Giá cao nhất" />
                </div>
                <div class="range-values">
                  <span>20.000 đ</span>
                  <span>80.000 đ</span>
                </div>
              </div>

              <div class="filter-actions">
                <button class="btn" type="button">Áp dụng</button>
                <a href="products.html" class="btn btn-outline">Xóa lọc</a>
              </div>
            </form>
          </aside>

          <div class="products-content">
            <div class="toolbar">
              <h2>Danh sách sản phẩm</h2>
              <div class="toolbar-actions">
                <span>8 sản phẩm</span>
                <label class="sort-label" for="sort-product">Sắp xếp</label>
                <div class="select-wrap sort-select">
                  <select id="sort-product">
                    <option>Mặc định</option>
                    <option>Giá thấp đến cao</option>
                    <option>Giá cao đến thấp</option>
                    <option>Mới nhất</option>
                    <option>Bán chạy</option>
                  </select>
                </div>
              </div>
            </div>

            <div id="products-list" class="product-grid products-page-grid"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Bản quyền © 2026 Đặng Anh Khoa</p>
      </div>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
