<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COFFEE - Sản phẩm</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">COFFEE</a>

        <nav class="main-nav">
          <a href="index.html">Trang chủ</a>
          <a href="products.html" class="active">Sản phẩm</a>
          <a href="cart.html">Giỏ hàng</a>
          <a href="checkout.html">Thanh toán</a>
        </nav>
      </div>
    </header>

    <main id="products-page">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Cửa hàng cà phê</p>

          <h1>Sản phẩm</h1>

          <p>
            Khám phá cà phê hạt, cà phê rang xay, drip bag, cold brew, dụng cụ
            pha và nhiều sản phẩm dành cho người yêu cà phê.
          </p>
        </div>
      </section>

      <section id="filter-products" class="section">
        <div class="container products-layout">
          <aside class="filter-sidebar">
            <div class="filter-panel">
              <h2>Bộ lọc</h2>
              <div class="filter-group">
                <label class="filter-label" for="search-product">
                  Tìm sản phẩm
                </label>
                <input
                  type="text"
                  id="search-product"
                  placeholder="Nhập tên sản phẩm..."
                />
              </div>
              <div class="filter-group">
                <label class="filter-label" for="category-product">
                  Danh mục
                </label>
                <div class="select-wrap">
                  <select id="category-product">
                    <option value="all">Tất cả danh mục</option>
                    <option value="Cà phê hạt">Cà phê hạt</option>
                    <option value="Cà phê xay">Cà phê xay</option>
                    <option value="Drip Bag">Drip Bag</option>
                    <option value="Cold Brew">Cold Brew</option>
                    <option value="Cà phê hòa tan">Cà phê hòa tan</option>
                    <option value="Capsule">Capsule</option>
                    <option value="Dụng cụ pha">Dụng cụ pha</option>
                    <option value="Máy xay">Máy xay</option>
                    <option value="Phụ kiện">Phụ kiện</option>
                    <option value="Combo">Combo</option>
                    <option value="Quà tặng">Quà tặng</option>
                  </select>
                </div>
              </div>
              <div class="filter-group">
                <label class="filter-label" for="status-product">
                  Trạng thái
                </label>

                <div class="select-wrap">
                  <select id="status-product">
                    <option value="all">Tất cả sản phẩm</option>
                    <option value="hot">Bán chạy</option>
                    <option value="new">Sản phẩm mới</option>
                    <option value="sale">Đang giảm giá</option>
                  </select>
                </div>
              </div>
              <div class="filter-group">
                <label class="filter-label" for="max-price"> Giá tối đa </label>

                <div class="price-filter">
                  <input
                    type="range"
                    id="max-price"
                    min="50000"
                    max="550000"
                    step="10000"
                    value="550000"
                  />

                  <div class="price-filter-value">
                    <span>Từ 0 đ</span>

                    <strong>
                      đến
                      <span id="max-price-value"> 550.000 đ </span>
                    </strong>
                  </div>
                </div>
              </div>
              <div class="filter-actions">
                <button id="reset-filter" class="btn btn-outline" type="button">
                  Xóa bộ lọc
                </button>
              </div>
            </div>
          </aside>

          <div class="products-content">
            <div class="toolbar">
              <div>
                <h2>Danh sách sản phẩm</h2>
                <span id="product-count"> 0 sản phẩm </span>
              </div>

              <div class="toolbar-actions">
                <label class="sort-label" for="sort-product"> Sắp xếp </label>

                <div class="select-wrap sort-select">
                  <select id="sort-product">
                    <option value="default">Mặc định</option>

                    <option value="price-asc">Giá thấp đến cao</option>

                    <option value="price-desc">Giá cao đến thấp</option>

                    <option value="name-asc">Tên A - Z</option>

                    <option value="name-desc">Tên Z - A</option>
                  </select>
                </div>
              </div>
            </div>

            <div id="products-list" class="product-grid products-page-grid">
              <!-- JavaScript render sản phẩm tại đây -->
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Bản quyền © 2026 Đặng Anh Khoa</p>
      </div>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
