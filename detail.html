<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CÔFÊ SHOP - Cà phê Robusta Buôn Ma Thuột 500g</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">CÔFÊ SHOP</a>

        <nav class="main-nav desktop-nav">
          <a href="index.html">Trang chủ</a>
          <a href="products.html" class="active">Sản phẩm</a>
          <a href="cart.html">
            Giỏ hàng
            <span class="nav-cart-count">0</span>
          </a>
          <a href="checkout.html">Thanh toán</a>
          <a class="account" href="login.html">Tài khoản</a>
        </nav>

        <details class="mobile-nav">
          <summary>
            <svg class="menu-icon" viewBox="0 0 24 24">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg class="close-icon" viewBox="0 0 24 24">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </summary>

          <nav class="main-nav mobile-menu">
            <a href="index.html">Trang chủ</a>
            <a href="products.html" class="active">Sản phẩm</a>
            <a href="cart.html">
              Giỏ hàng
              <span class="nav-cart-count">0</span>
            </a>
            <a href="checkout.html">Thanh toán</a>
            <a class="account" href="login.html">Tài khoản</a>
          </nav>
        </details>
      </div>
    </header>

    <main id="detail-page">
      <section class="detail-section">
        <div class="container detail-breadcrumb">
          <a href="products.html">Sản phẩm</a>
          <svg viewBox="0 0 24 24">
            <path d="m9 18 6-6-6-6" />
          </svg>
          <span>Chi tiết sản phẩm</span>
        </div>

        <div id="product-detail" class="container detail-layout">
          <!-- render detail product -->
        </div>
      </section>

      <section id="relate-products" class="section related-products">
        <div class="container">
          <div class="related-products-heading">
            <p class="section-eyebrow">Có thể bạn sẽ thích</p>
            <h2 class="section-title">Sản phẩm liên quan</h2>
          </div>

          <div class="product-grid"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Bản quyền © 2026 Đặng Anh Khoa</p>
      </div>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
